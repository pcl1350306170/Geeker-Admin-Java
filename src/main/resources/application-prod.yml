# 部署环境配置，运行 jar 包时通过 --spring.profiles.active=prod 激活
server:
  # WSL 部署实例端口，与本地 dev（8880）区分，避免端口冲突，可同时运行
  port: 8881
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/geeker_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: dev_user
    password: 123456

# 文件上传配置（WSL 中 D 盘挂载于 /mnt/d，指向同一个 image-cdn 仓库）
app:
  upload:
    path: /mnt/d/CODE/image-cdn/Upload
