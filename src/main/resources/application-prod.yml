# 部署环境配置，运行 jar 包时通过 --spring.profiles.active=prod 激活
# 安全约定：本文件不得包含任何真实口令/密钥；敏感值一律由环境变量注入
# （DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET 由 systemd EnvironmentFile 提供）
server:
  # WSL 部署实例端口，与本地 dev（8880）区分，避免端口冲突，可同时运行
  port: ${SERVER_PORT:8881}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/geeker_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:dev_user}
    # 无默认值：未注入 DB_PASSWORD 时启动直接失败，避免误用弱口令
    password: ${DB_PASSWORD}

# 文件上传配置（WSL 中 D 盘挂载于 /mnt/d，指向同一个 image-cdn 仓库）
app:
  upload:
    path: /mnt/d/CODE/image-cdn/Upload

jwt:
  # 无默认值：未注入 JWT_SECRET 时启动直接失败（HS256 要求密钥长度 >= 32 字节）
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
