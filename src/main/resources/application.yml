server:
  port: 8880

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/geeker_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# 文件上传配置
app:
  upload:
    # 上传文件存储目录（相对于项目运行目录）
    path: ./uploads

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: GeekerAdminSecretKeyForJWT2025Secure
  expiration: 86400000
