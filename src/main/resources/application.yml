server:
  port: 8880

spring:
  # 默认本地调试环境，部署时通过 --spring.profiles.active=prod 切换
  profiles:
    active: dev
  datasource:
    # 本地 dev 默认值，生产环境通过环境变量覆盖（见 application-prod.yml）
    url: ${DB_URL:jdbc:mysql://localhost:3307/geeker_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:dev_user}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:

    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# 文件上传配置
app:
  upload:
    # 上传文件存储目录（image-cdn 仓库，手动 push 后通过 jsDelivr 访问）
    path: D:\CODE\image-cdn\Upload
    # 返回给前端的 CDN 地址前缀
    cdn-prefix: https://cdn.jsdelivr.net/gh/pcl1350306170/image-cdn@refs/heads/main/Upload

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  # 仅用于本地 dev 的占位密钥（禁止用于生产）；生产必须由环境变量 JWT_SECRET 注入
  secret: ${JWT_SECRET:GeekerAdminDevOnlySecretPleaseChangeMe0123456789}
  expiration: ${JWT_EXPIRATION:86400000}
